name: sathi_claim_recovery
description: Sathi — accessible, privacy-aware health insurance claim recovery companion.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  image_picker: ^1.2.4
  file_picker: ^13.3.0
  http: ^1.5.0
  google_mlkit_text_recognition: ^0.17.1
  speech_to_text: ^7.5.0
  record: ^7.1.2
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
